name: Deploy to Hugging Face Space

# Week 5 (Hardening) — Software/Integration Lead task: "Deploy to Hugging
# Face Spaces ... fix deployment-specific bugs." This automates the manual
# steps in deployment/huggingface/DEPLOY.md so a push to main always ships
# the same thing that passed the pre-push integration check.
#
# Required repo secret (GitHub repo Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   HF_TOKEN        a Hugging Face token with "write" access to the target Space.
# Required repo variable (same settings page, "Variables" tab):
#   HF_SPACE_REPO   e.g. "your-username/sentinelsat-ids"
#
# This workflow does NOT set GROQ_API_KEY -- that stays a Space-level
# secret (Space Settings -> Variables and secrets), set once by hand, per
# DEPLOY.md step 4. Never put the Groq key in GitHub Actions secrets for
# this job; the job has no reason to touch it.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install just what the pre-push check needs
        run: pip install chromadb

      - name: Pre-push integration check (deployment/huggingface/verify_space_ready.py)
        run: python deployment/huggingface/verify_space_ready.py

      - name: Assemble the Space payload (swap README + requirements.txt)
        run: |
          set -e
          rm -rf /tmp/space_payload
          cp -r . /tmp/space_payload
          rm -rf /tmp/space_payload/.git
          cat deployment/huggingface/README.md README.md > /tmp/space_payload/README.md
          cp deployment/huggingface/requirements.txt /tmp/space_payload/requirements.txt

      - name: Push to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.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 }}
          HF_SPACE_REPO: ${{ vars.Amuthavel2402/SentinelSat_AI_detection_system }}
        run: |
          set -e
          if [ -z "${HF_SPACE_REPO}" ]; then
            echo "HF_SPACE_REPO repo variable is not set -- see this file's header comment. Skipping push."
            exit 1
          fi
          cd /tmp/space_payload
          git init -q
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote add space "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          git add -A
          git commit -q -m "Deploy: ${{ github.sha }}"
          git push -f space HEAD:main
